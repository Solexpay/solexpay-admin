<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />

  <!-- Private admin console: keep it out of search and link previews. -->
  <title>Solexpay Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />

  <!-- ── Theme & PWA ──────────────────────────────────────────────────────── -->
  <meta name="theme-color" content="#eef0f3" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SolexPay" />
  <meta name="application-name" content="SolexPay" />

  <!-- ── Favicons & Icons ─────────────────────────────────────────────────── -->
  <link rel="icon"             type="image/x-icon"   href="/favicon.ico" />
  <link rel="icon"             type="image/png" sizes="16x16"  href="/favicon-16x16.png" />
  <link rel="icon"             type="image/png" sizes="32x32"  href="/favicon-32x32.png" />
  <link rel="icon"             type="image/png" sizes="96x96"  href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180"        href="/apple-touch-icon.png" />
  <link rel="manifest"                                href="/site.webmanifest" />

  <!-- ── Styles ──────────────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="/src/styles.css" />

  <!-- ── Fonts ────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <app-root></app-root>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
